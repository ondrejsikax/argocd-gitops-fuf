apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: counter-app
  namespace: argocd
spec: 
  project: default
  source:
    repoURL: https://github.com/HonzaFoniok/deploy-this-to-k8s.git
    path: k8s
    targetRevision: HEAD
  destination:
    namespace: counter-app
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: True
      selfHeal: True
    syncOptions:
      - CreateNamespace=true
