apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-fuf
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: clusters/fuf
    repoURL: https://github.com/ondrejsikax/argocd-gitops-fuf.git
    targetRevision: HEAD
    directory:
      recurse: true
      exclude: '{**/manifests/**,**/Chart.yaml,**/values.y*ml,**/*.values.y*ml,**/templates/**}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
