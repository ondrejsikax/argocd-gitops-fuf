apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: counter-backend-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HonzaFoniok/deploy-this-to-k8s.git
    path: helm/backend
    targetRevision: HEAD
  destination:
    namespace: counter-app-helm
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
        - CreateNamespace=true
