apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: counter-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/HonzaFoniok/deploy-this-to-k8s.git
    path: k8s
    targerRevision: HEAD
  destination:
    namespace: counter-app
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
          - CreateNamespace=true
