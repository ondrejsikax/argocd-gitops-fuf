apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: counter-redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 18.6.1
    values: |
      architecture: standalone 
      auth:
        enabled: false
  destination:
    namespace: counter-app
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
