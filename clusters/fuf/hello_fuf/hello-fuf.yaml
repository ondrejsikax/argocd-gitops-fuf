apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-fuf
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: https://github.com/ondrejsikax/hello-fuf-k8s.git
    path: ./k8s
    targetRevision: main
  destination:
    namespace: hello-fuf
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
        - CreateNamespace=true
