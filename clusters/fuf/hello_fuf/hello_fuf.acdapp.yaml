apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-fuf
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: hello-fuf
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://github.com/ondrejsikax/hello-fuf-k8s.git
      path: ./k8s
