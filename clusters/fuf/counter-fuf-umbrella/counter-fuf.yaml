  name: counter-redis-manifest
  namespace: argocd
spec:
  project: default
  project: counter-fuf
  source:
    repoURL: https://github.com/HonzaFoniok/argocd-monorepo.git
    path: helm
    targetRevision: HEAD
  destination:
    namespace: counter-app
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
