apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: counter-redis-manifest
  namespace: argocd
spec:
  project: counter-fuf-manifest
  source:
    repoURL: https://github.com/HonzaFoniok/deploy-this-to-k8s.git
    path: k8s/redis-deployment
    targetRevision: HEAD
  destination:
    namespace: counter-app
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
