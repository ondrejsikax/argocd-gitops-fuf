apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: counter-redis-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis
    targetRevision: 28.3.12
    helm:
      values: |
        architecture: standalone 
        auth:
          enabled: false
  destination:
    namespace: counter-app-helm
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
