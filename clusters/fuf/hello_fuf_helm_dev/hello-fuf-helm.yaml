apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-fuf-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ondrejsikax/hello-fuf-k8s.git
    path: helm
    targetRevision: main
  destination:
    namespace: hello-fuf-helm
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: truei
    syncOptions:
      - CreateNamespace=true
