apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-helm
  namespace: argocd
spec:
  project: default
  destination:
    namespace: hello-world
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
        - CreateNamespace=true
  source:
    repoURL: https://github.com/sikalabs/charts.git
    path: charts/hello-world
    helm:
      valuesObject:
        host: hello.fuf.sikademo.com
        TEXT_SUFFIX: "(fuf)"
        replicas: 2
